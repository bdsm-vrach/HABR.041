<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EINHEIT-OS // ДЕЛО HABR.041</title>
<style>
  :root {
    --bg: #0c1911;
    --bg-deep: #060d09;
    --panel: #0a1510;
    --panel-2: #0e1c16;
    --green: #1d3a2a;
    --green-soft: #2e5c42;
    --green-bright: #4fae7a;
    --green-glow: #7fe0a8;
    --blue: #0a1a2e;
    --blue-soft: #12304f;
    --blue-bright: #3f7fbf;
    --blue-glow: #7fc4ff;
    --ink: #bfe6d0;
    --ink-dim: #6f9a82;
    --ink-faint: #3f5c4c;
    --warn: #ff6a6a;
    --scan: rgba(63, 127, 191, 0.06);
    --glow: 0 0 4px rgba(79,174,122,.55), 0 0 16px rgba(18,48,79,.35);
    --glow-strong: 0 0 6px rgba(127,224,168,.7), 0 0 20px rgba(63,127,191,.45);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  *::-webkit-scrollbar { width: 12px; height: 12px; }
  *::-webkit-scrollbar-track {
    background: repeating-linear-gradient(0deg, #08120c 0 2px, #0c1911 2px 4px);
    border: 1px solid var(--green);
  }
  *::-webkit-scrollbar-thumb {
    background: var(--green-soft);
    border: 1px solid var(--green-bright);
    box-shadow: inset -2px -2px 0 0 #0a1a2e, inset 2px 2px 0 0 #7fe0a8;
  }
  *::-webkit-scrollbar-thumb:hover { background: var(--green-bright); }
  * { scrollbar-width: thin; scrollbar-color: var(--green-soft) #08120c; }

  html, body {
    height: 100%;
    background: #000;
    color: var(--ink);
    font-family: "Courier New", monospace;
    overflow: hidden;
  }

  @keyframes blink { 50% { opacity: 0; } }
  @keyframes flicker {
    0%, 100% { opacity: .85; }
    47% { opacity: .95; }
    48% { opacity: .4; }
    49% { opacity: .95; }
    92% { opacity: .75; }
  }

  /* ================= BOOT: ГОРЫ В ПАЛИТРЕ САЙТА + ПАЛАТКА + ВЬЮГА ================= */
  .boot {
    position: fixed; inset: 0; z-index: 100;
    background: #060d09;
    overflow: hidden;
    transition: opacity .8s ease, transform .8s ease;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  .boot.done { opacity: 0; transform: scale(1.04); pointer-events: none; }

  /* Ночное небо в палитре сайта */
  .boot .sky {
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg,
        #060d09 0%,
        #0a1a2e 25%,
        #10241a 50%,
        #0c1911 75%,
        #060d09 100%);
    z-index: 0;
  }
  /* Светило (луна) */
  .boot .sky::before {
    content: "";
    position: absolute; top: 12%; right: 20%;
    width: 50px; height: 50px;
    background: #bfe6d0;
    border-radius: 50%;
    box-shadow: 0 0 30px rgba(191,230,208,.4), 0 0 80px rgba(127,196,255,.2);
    opacity: .75;
  }

  /* Пиксельные горы (высокие, детализированные) */
  .boot .mountains {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 75%;
    z-index: 1;
    image-rendering: pixelated;
  }
  .boot .mountains svg {
    width: 100%; height: 100%; display: block;
    shape-rendering: crispEdges;
    image-rendering: pixelated;
  }

  /* Снежная земля */
  .boot .snow-ground {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 22%;
    background:
      repeating-linear-gradient(90deg,
        #0e1c16 0 8px,
        #10241a 8px 16px,
        #0e1c16 16px 24px,
        #12304f 24px 32px);
    border-top: 4px solid #2e5c42;
    box-shadow: inset 0 20px 40px rgba(6,13,9,.6);
    z-index: 2;
  }
  .boot .snow-ground::before {
    content: "";
    position: absolute; left: 0; right: 0; top: 0; height: 50%;
    background: repeating-linear-gradient(90deg,
      rgba(46,92,66,.15) 0 12px,
      transparent 12px 24px);
    image-rendering: pixelated;
  }

  /* Сугробы */
  .boot .snowdrift {
    position: absolute;
    bottom: 18%;
    background: #10241a;
    border-top: 3px solid #2e5c42;
    z-index: 3;
    image-rendering: pixelated;
  }
  .boot .snowdrift.d1 { left: 0; width: 35%; height: 5%; border-radius: 0 70% 0 0 / 0 100% 0 0; }
  .boot .snowdrift.d2 { right: 0; width: 40%; height: 6%; border-radius: 70% 0 0 0 / 100% 0 0 0; }

  /* Красные следы на снегу */
  .boot .blood-trail {
    position: absolute; left: 0; right: 0; bottom: 10%; height: 15%; z-index: 4; pointer-events: none;
  }
  .boot .blood-trail .print {
    position: absolute; width: 10px; height: 6px;
    background: #a01010;
    border-radius: 40% 60% 50% 50% / 60% 60% 40% 40%;
    box-shadow: 0 0 6px rgba(160,16,16,.6); opacity: .9;
    image-rendering: pixelated;
  }
  .boot .blood-trail .print::after {
    content: ""; position: absolute; width: 2px; height: 2px;
    background: #7a0808; border-radius: 50%; top: 2px; left: 2px;
  }
  .boot .blood-trail .p1  { left: 10%;  bottom: 60%; transform: rotate(-12deg); }
  .boot .blood-trail .p2  { left: 14%; bottom: 55%; transform: rotate(8deg); }
  .boot .blood-trail .p3  { left: 18%; bottom: 48%; transform: rotate(-6deg); }
  .boot .blood-trail .p4  { left: 22%; bottom: 42%; transform: rotate(14deg); }
  .boot .blood-trail .p5  { left: 27%; bottom: 36%; transform: rotate(-10deg); }
  .boot .blood-trail .p6  { left: 31%; bottom: 30%; transform: rotate(6deg); }
  .boot .blood-trail .p7  { left: 36%; bottom: 26%; transform: rotate(-8deg); }
  .boot .blood-trail .p8  { left: 40%; bottom: 22%; transform: rotate(10deg); }

  /* Палатка (анимация колыхания) */
  .boot .tent {
    position: absolute;
    left: 50%; bottom: 20%;
    transform: translateX(-50%);
    width: 300px; height: 210px;
    z-index: 6;
    transform-origin: bottom center;
    animation: tentSway 3.5s ease-in-out infinite;
    image-rendering: pixelated;
  }
  .boot .tent svg {
    width: 100%; height: 100%; display: block;
    filter: drop-shadow(0 20px 30px rgba(0,0,0,.8));
    image-rendering: pixelated;
    shape-rendering: crispEdges;
  }
  @keyframes tentSway {
    0%, 100% { transform: translateX(-50%) skewX(0deg) scaleX(1); }
    25% { transform: translateX(-50%) skewX(0.6deg) scaleX(0.995); }
    50% { transform: translateX(-50%) skewX(-0.4deg) scaleX(1.005); }
    75% { transform: translateX(-50%) skewX(0.5deg) scaleX(0.998); }
  }

  /* Снежная вьюга */
  .boot .blizzard {
    position: absolute; inset: 0;
    z-index: 8;
    pointer-events: none;
    overflow: hidden;
  }
  .boot .blizzard .flake {
    position: absolute;
    background: #bfe6d0;
    box-shadow: 0 0 4px rgba(191,230,208,.8);
    opacity: .9;
    image-rendering: pixelated;
  }
  @keyframes blizzardFall {
    0%   { transform: translateY(-10vh) translateX(0); opacity: 0; }
    10%  { opacity: 1; }
    100% { transform: translateY(110vh) translateX(-60px); opacity: .3; }
  }

  .boot .crt-lines {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, rgba(63,127,191,.08) 0 1px, transparent 1px 3px);
    pointer-events: none; z-index: 30; animation: flicker 4s infinite;
  }

  .boot .boot-log {
    position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%);
    width: min(680px, 88vw); z-index: 15;
    color: #bfe6d0; font-family: "Courier New", monospace;
    font-size: 11px; letter-spacing: 1.5px;
    text-shadow: 0 0 6px rgba(63,127,191,.5); pointer-events: none;
  }
  .boot .boot-log-line {
    opacity: 0; transform: translateX(-6px);
    animation: logAppear .35s ease-out forwards;
    animation-delay: calc(var(--d, 0) * 1ms);
    padding: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .boot .boot-log-line .ok { color: #7fe0a8; text-shadow: 0 0 6px rgba(127,224,168,.6); }
  .boot .boot-log-line .warn { color: #ff6a6a; text-shadow: 0 0 8px rgba(255,106,106,.8); animation: blink 1.1s steps(2) infinite; }
  @keyframes logAppear { 0% { opacity: 0; transform: translateX(-6px); } 100% { opacity: 1; transform: translateX(0); } }

  .boot .boot-log .loading {
    position: relative; left: auto; bottom: auto; transform: none;
    width: 100%; margin-top: 12px; text-align: left; opacity: 0;
    animation: logAppear .4s ease-out forwards; animation-delay: 4600ms;
  }
  .boot .loading { color: #bfe6d0; font-size: 11px; letter-spacing: 3px; text-shadow: var(--glow); pointer-events: none; }
  .boot .loading .bar {
    width: 100%; height: 12px; margin-top: 6px;
    border: 2px solid var(--green-soft); background: #08120c;
    position: relative; overflow: hidden; box-shadow: 0 0 12px rgba(29,58,42,.6);
  }
  .boot .loading .bar::after {
    content: ""; position: absolute; inset: 2px; width: var(--w, 0%);
    background: repeating-linear-gradient(90deg, #4fae7a 0 6px, #2e5c42 6px 8px);
    box-shadow: 0 0 10px rgba(127,224,168,.6); transition: width .25s linear;
  }

  .boot .launch { position: absolute; bottom: 24px; right: 32px; z-index: 50; }

  .ok-btn {
    display: inline-block; padding: 8px 18px;
    background: #12304f; border: 2px solid var(--green-soft);
    box-shadow: inset 2px 2px 0 0 #7fe0a8, inset -2px -2px 0 0 rgba(0,0,0,.6), 3px 3px 0 0 rgba(0,0,0,.7), 0 0 14px rgba(29,58,42,.5);
    color: #bfe6d0; font-family: inherit; font-size: 14px; letter-spacing: 2px;
    cursor: pointer; text-shadow: 0 0 6px rgba(127,224,168,.5);
  }
  .ok-btn:hover { background: #1d3a2a; box-shadow: inset 2px 2px 0 0 #7fe0a8, inset -2px -2px 0 0 rgba(0,0,0,.6), 3px 3px 0 0 rgba(0,0,0,.7), 0 0 24px rgba(127,224,168,.8); }
  .ok-btn:active { box-shadow: inset -2px -2px 0 0 #7fe0a8, inset 2px 2px 0 0 rgba(0,0,0,.6), 1px 1px 0 0 rgba(0,0,0,.7); transform: translate(2px, 2px); }

  /* ================= ДОСЬЕ ================= */
  .crt {
    position: relative; width: 100vw; height: 100vh;
    background: radial-gradient(ellipse at center, #10241a 0%, #060d09 100%);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .crt::before {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, var(--scan) 0px, var(--scan) 1px, transparent 1px, transparent 3px);
    pointer-events: none; z-index: 10; animation: flicker 4s infinite;
  }
  .crt::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.85) 100%);
    pointer-events: none; z-index: 11;
  }

  .screen {
    position: relative;
    width: min(1100px, 94vw); height: min(760px, 92vh);
    background: var(--panel); border: 1px solid var(--green-soft);
    padding: 22px 26px; display: flex; flex-direction: column;
    min-height: 0; overflow: hidden;
    border-radius: 22px / 30px;
    box-shadow: 0 0 0 2px #000 inset, 0 0 0 6px rgba(18,48,79,.35), 0 0 40px rgba(29,58,42,.35), 0 0 100px rgba(18,48,79,.25);
    text-shadow: var(--glow); animation: bootScreen 1.2s ease-out;
  }
  .screen::before, .screen::after {
    content: ""; position: absolute; left: 0; right: 0; height: 26px; pointer-events: none; z-index: 5;
  }
  .screen::before { top: 0; background: linear-gradient(180deg, rgba(0,0,0,.55), transparent); border-radius: 22px 22px 0 0 / 30px 30px 0 0; }
  .screen::after { bottom: 0; background: linear-gradient(0deg, rgba(0,0,0,.55), transparent); border-radius: 0 0 22px 22px / 0 0 30px 30px; }
  @keyframes bootScreen {
    0% { opacity: 0; transform: scaleY(0.02); filter: brightness(4); }
    40% { opacity: 1; transform: scaleY(0.02); }
    60% { transform: scaleY(1.02); }
    100% { transform: scaleY(1); filter: brightness(1); }
  }

  .topbar {
    display: flex; justify-content: space-between;
    font-size: 13px; letter-spacing: 2px; color: var(--ink-dim);
    border-bottom: 1px dashed var(--green-soft); padding-bottom: 8px;
    text-transform: uppercase; flex: 0 0 auto; gap: 12px; flex-wrap: wrap;
  }
  .topbar .blink { animation: blink 1.1s steps(2) infinite; color: var(--green-bright); }

  .title {
    margin-top: 16px; font-size: 28px; letter-spacing: 6px;
    border-bottom: 2px solid var(--green-bright); padding-bottom: 8px;
    display: flex; justify-content: space-between; align-items: flex-end;
    gap: 10px; flex-wrap: wrap; flex: 0 0 auto;
    color: var(--green-glow); text-shadow: 0 0 12px rgba(79,174,122,.7), 0 0 30px rgba(18,48,79,.5);
  }

  .tabs {
    display: flex; gap: 0; margin-top: 14px;
    border-bottom: 1px solid var(--green-soft);
    position: relative; flex-wrap: wrap; flex: 0 0 auto;
  }
  .tab {
    padding: 8px 18px; font-family: inherit; font-size: 12px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--ink-dim); background: transparent;
    border: 1px solid transparent; border-bottom: none; cursor: pointer;
    position: relative; top: 1px; transition: color .12s ease, background .12s ease;
    user-select: none;
  }
  .tab:hover { color: var(--green-glow); }
  .tab.active {
    color: var(--green-glow); background: rgba(29,58,42,.25);
    border-color: var(--green-soft); border-bottom: 1px solid var(--panel);
    text-shadow: var(--glow-strong);
  }
  .tab.locked::after { content: "⛔"; margin-left: 6px; font-size: 10px; }

  .tab-content {
    display: none; flex: 1 1 auto; min-height: 0;
    flex-direction: column; overflow: hidden;
  }
  .tab-content.active { display: flex; }

  .data {
    flex: 1 1 auto; min-height: 0;
    overflow-y: auto; overflow-x: hidden;
    padding-right: 14px; font-size: 14px; line-height: 1.6;
    margin-top: 16px; position: relative;
  }

  .data.with-bg {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 600'><g fill='none' stroke='%2312304f' stroke-width='2' opacity='0.5'><polygon points='80,60 110,45 140,60 140,90 110,105 80,90'/><polygon points='40,180 70,165 100,180 100,210 70,225 40,210'/><polygon points='110,180 140,165 170,180 170,210 140,225 110,210'/><polygon points='75,230 105,215 135,230 135,260 105,275 75,260'/><polygon points='110,290 140,275 170,290 170,320 140,335 110,320'/><polygon points='300,120 330,105 360,120 360,150 330,165 300,150'/><polygon points='320,200 350,185 380,200 380,230 350,245 320,230'/><polygon points='300,280 330,265 360,280 360,310 330,325 300,310'/></g><g stroke='%233f7fbf' stroke-width='2' opacity='0.6'><line x1='110' y1='105' x2='110' y2='165'/><line x1='105' y1='215' x2='110' y2='275'/><line x1='140' y1='275' x2='140' y2='320'/><line x1='330' y1='165' x2='330' y2='265'/></g></svg>");
    background-repeat: no-repeat; background-position: center 20px; background-size: 60% auto;
  }

  .case {
    position: relative; border: 1px solid var(--green-soft);
    background: rgba(10,21,16,.72); padding: 20px 22px 24px 22px;
    box-shadow: inset 0 0 0 1px rgba(79,174,122,.08), inset 0 0 40px rgba(10,26,46,.5);
    margin-bottom: 18px; backdrop-filter: blur(1px);
  }
  .case::before, .case::after {
    content: ""; position: absolute; width: 18px; height: 18px;
    border: 1px solid var(--green-glow); pointer-events: none;
    filter: drop-shadow(0 0 4px rgba(127,224,168,.7));
  }
  .case::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .case::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

  .case .case-stamp {
    position: absolute; top: 14px; right: 18px;
    font-size: 10px; letter-spacing: 4px; color: var(--green-glow);
    border: 1px solid var(--green-glow); padding: 3px 10px;
    transform: rotate(-6deg); opacity: .8; background: rgba(10,21,16,.6);
    text-shadow: 0 0 6px rgba(127,224,168,.6); pointer-events: none;
  }

  .case-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px; padding-bottom: 8px; margin-bottom: 14px;
    border-bottom: 2px solid var(--green-bright); flex-wrap: wrap;
  }
  .case-head h2 {
    font-size: 13px; letter-spacing: 5px; color: var(--green-glow);
    text-transform: uppercase; text-shadow: 0 0 10px rgba(79,174,122,.7);
    border: none; padding: 0; margin: 0;
  }
  .case-head .case-num { font-size: 10px; letter-spacing: 3px; color: var(--ink-dim); }

  .section { margin-bottom: 20px; position: relative; }
  .section h2 {
    font-size: 12px; letter-spacing: 4px; color: var(--green-bright);
    background: linear-gradient(90deg, rgba(29,58,42,.45), transparent 80%);
    padding: 5px 10px 5px 10px; margin-bottom: 10px;
    text-transform: uppercase; border-left: 3px solid var(--green-bright);
    text-shadow: 0 0 8px rgba(127,224,168,.5);
  }

  .row {
    display: grid; grid-template-columns: 210px 1fr; padding: 0;
    border-bottom: 1px dotted rgba(46,92,66,.5); align-items: stretch;
  }
  .row .k {
    padding: 6px 10px; color: var(--ink-dim); letter-spacing: 1px;
    background: rgba(18,48,79,.3); border-right: 1px dotted rgba(46,92,66,.5); font-size: 13px;
  }
  .row .v { padding: 6px 10px; color: var(--ink); font-size: 13px; }
  .v.warn { color: var(--warn); text-shadow: 0 0 8px rgba(255,106,106,.7); }
  .v.ok   { color: var(--green-glow); text-shadow: 0 0 8px rgba(127,224,168,.5); }

  .row.full {
    display: block; padding: 10px 12px; line-height: 1.75; color: var(--ink);
    background: rgba(18,48,79,.22); border: 1px solid rgba(46,92,66,.45);
    margin-top: 8px; font-size: 13px;
  }

  .bar {
    display: inline-block; width: 140px; height: 10px;
    border: 1px solid var(--green-soft); background: #08120c;
    position: relative; vertical-align: middle; margin-right: 8px;
  }
  .bar::after {
    content: ""; position: absolute; inset: 1px; width: var(--w, 50%);
    background: linear-gradient(90deg, #1d3a2a, #7fe0a8);
    box-shadow: 0 0 8px rgba(127,224,168,.7);
  }

  .redacted {
    background: #12304f; color: transparent; text-shadow: none; user-select: none;
    padding: 0 6px; border: 1px solid #0a1a2e; box-shadow: 0 0 8px #06101a; letter-spacing: 0;
  }

  .items { border: 1px solid var(--green-soft); background: rgba(18,48,79,.22); padding: 0; }
  .item {
    display: grid; grid-template-columns: 46px 52px 1fr; align-items: center;
    padding: 8px 12px; border-bottom: 1px dotted rgba(46,92,66,.5);
    font-size: 13px; gap: 10px; cursor: pointer;
    transition: background .12s ease, transform .1s ease, box-shadow .12s ease;
  }
  .item:last-child { border-bottom: none; }
  .item:hover { background: rgba(29,58,42,.45); box-shadow: inset 0 0 0 1px rgba(127,224,168,.35); }
  .item:active { transform: translate(1px, 1px); }
  .item .num { color: var(--green-bright); letter-spacing: 2px; font-weight: bold; }
  .item .icon {
    width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(79,174,122,.4); background: rgba(6,13,9,.6);
    box-shadow: inset 0 0 8px rgba(10,26,46,.7);
  }
  .item .icon svg { width: 32px; height: 32px; display: block; }
  .item .name {
    color: var(--ink); display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .item .name::after { content: "▸"; color: var(--green-bright); opacity: .6; font-size: 11px; }
  .item:hover .name::after { opacity: 1; }

  .item-modal {
    position: fixed; inset: 0; z-index: 200; display: none;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,.85); backdrop-filter: blur(2px); padding: 20px;
  }
  .item-modal.visible { display: flex; animation: modalFade .2s ease-out; }
  @keyframes modalFade { 0% { opacity: 0; } 100% { opacity: 1; } }

  .item-modal-box {
    position: relative; width: min(560px, 92vw); max-height: 88vh;
    background: var(--panel); border: 2px solid var(--green-soft);
    border-radius: 18px / 24px;
    box-shadow: 0 0 0 2px #000 inset, 0 0 40px rgba(29,58,42,.5), 0 0 80px rgba(18,48,79,.35);
    padding: 26px 28px 24px 28px; animation: modalOpen .25s ease-out; overflow: auto;
  }
  @keyframes modalOpen {
    0% { opacity: 0; transform: scale(.94) translateY(8px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  .item-modal-box::before, .item-modal-box::after {
    content: ""; position: absolute; width: 20px; height: 20px;
    border: 1px solid var(--green-glow); pointer-events: none;
    filter: drop-shadow(0 0 4px rgba(127,224,168,.8));
  }
  .item-modal-box::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .item-modal-box::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

  .item-modal-head {
    display: flex; justify-content: space-between; align-items: baseline;
    border-bottom: 2px solid var(--green-bright); padding-bottom: 10px;
    margin-bottom: 20px; gap: 12px;
  }
  .item-modal-head .im-title {
    font-size: 13px; letter-spacing: 5px; color: var(--green-glow);
